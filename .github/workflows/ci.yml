name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install . -r requirements-dev.txt
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: coverage run --source=repo_eval_workbench -m unittest discover -s tests
      - run: coverage report --fail-under=90
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (no runtime dependencies)
        run: python -m pip install .
      - name: Unit and CLI tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce example report
        run: |
          repo-eval evaluate --dataset data/benchmark.jsonl --predictions data/example_predictions.jsonl --format json > /tmp/example-evaluation.json
          diff -u reports/example-evaluation.json /tmp/example-evaluation.json
      - name: Run deterministic baseline
        run: |
          repo-eval baseline --dataset data/benchmark.jsonl --output /tmp/baseline.jsonl
          repo-eval evaluate --dataset data/benchmark.jsonl --predictions /tmp/baseline.jsonl --fail-under 0.90
